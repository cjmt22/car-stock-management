<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarStock — My Bookings</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<nav>
    <a class="nav-brand" href="../index.html">🚗 CarStock</a>
    <ul class="nav-links">
        <li><a href="cars.html">Browse Cars</a></li>
        <li id="nav-user" style="display:flex;gap:1rem;align-items:center">
            <span id="nav-name" style="color:#ccc;font-size:0.9rem"></span>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </li>
    </ul>
</nav>

<div class="dashboard">
    <div class="dashboard-header">
        <div class="dashboard-title">My Bookings</div>
        <a href="cars.html">
            <button class="btn btn-primary">Browse More Cars</button>
        </a>
    </div>

    <div class="table-container">
        <div class="table-title">Your Test Drive Requests</div>
        <div id="bookings-body">
            <div class="loading">Loading your bookings...</div>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Guard: only Buyers can access this page
        requireRole('Buyer');
        updateNav();
        await loadBookings();
    });

    async function loadBookings() {
        const container = document.getElementById('bookings-body');

        try {
            const response = await apiGetMyBookings();
            const bookings = await response.json();

            if (!bookings || bookings.length === 0) {
                container.innerHTML =
                    '<div class="loading">You have no bookings yet. ' +
                    '<a href="cars.html" style="color:#e94560">Browse cars</a> to book a test drive.</div>';
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Car</th>
                            <th>Price</th>
                            <th>Date Requested</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${bookings.map(b => `
                            <tr>
                                <td>${b.carYear} ${b.carMake} ${b.carModel}</td>
                                <td>$${b.carPrice.toLocaleString()}</td>
                                <td>${new Date(b.bookingDate).toLocaleDateString('en-AU')}</td>
                                <td>
                                    <span class="status-badge
                                        ${b.status === 'Approved' ? 'status-available' :
                                          b.status === 'Pending'  ? 'status-reserved'  :
                                                                    'status-sold'}">
                                        ${b.status}
                                    </span>
                                </td>
                                <td>
                                    ${b.status === 'Pending' ? `
                                        <button class="btn btn-danger"
                                            onclick="cancelBooking(${b.id})">
                                            Cancel
                                        </button>` : '—'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } catch (err) {
            container.innerHTML = '<div class="loading">Failed to load bookings.</div>';
        }
    }

    async function cancelBooking(id) {
        if (!confirm('Are you sure you want to cancel this booking?')) return;

        const response = await apiUpdateBookingStatus(id, 'Cancelled');
        if (response.ok) {
            alert('Booking cancelled.');
            await loadBookings();
        } else {
            const data = await response.json();
            alert(data.message || 'Failed to cancel booking.');
        }
    }
</script>
</body>
</html>
