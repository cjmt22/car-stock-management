<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarStock — Car Detail</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<nav>
    <a class="nav-brand" href="../index.html">🚗 CarStock</a>
    <ul class="nav-links">
        <li><a href="cars.html">Browse Cars</a></li>
        <li id="nav-auth" style="display:flex;gap:1rem">
            <a href="login.html"><button class="btn btn-outline">Login</button></a>
        </li>
        <li id="nav-user" style="display:none;gap:1rem;align-items:center">
            <span id="nav-name" style="color:#ccc;font-size:0.9rem"></span>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </li>
    </ul>
</nav>

<div class="section" id="car-detail">
    <div class="loading">Loading car details...</div>
</div>

<!-- Booking Form (shown only to logged-in Buyers) -->
<div class="form-container" id="booking-form" style="display:none">
    <div class="form-title">Book a Test Drive</div>
    <div id="booking-error" class="alert alert-error" style="display:none"></div>
    <div id="booking-success" class="alert alert-success" style="display:none"></div>

    <div class="form-group">
        <label>Preferred Date & Time</label>
        <input type="datetime-local" id="booking-date">
    </div>
    <div class="form-group">
        <label>Message to Dealer (optional)</label>
        <textarea id="booking-notes" rows="3"
            placeholder="Any special requests or questions..."></textarea>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="submitBooking()">
        Request Test Drive
    </button>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    let currentCarId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        updateNav();

        // Get car ID from URL: car-detail.html?id=1
        const params = new URLSearchParams(window.location.search);
        currentCarId = params.get('id');

        if (!currentCarId) {
            document.getElementById('car-detail').innerHTML =
                '<div class="loading">No car selected.</div>';
            return;
        }

        await loadCarDetail(currentCarId);

        // Show booking form only to logged-in Buyers
        if (isLoggedIn() && getUserRole() === 'Buyer') {
            document.getElementById('booking-form').style.display = 'block';
        }
    });

    async function loadCarDetail(id) {
        const container = document.getElementById('car-detail');

        try {
            const response = await apiGetCarById(id);
            if (!response.ok) {
                container.innerHTML = '<div class="loading">Car not found.</div>';
                return;
            }

            const car = await response.json();

            container.innerHTML = `
                <a href="cars.html" style="color:#e94560;font-size:0.9rem">← Back to listings</a>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:1.5rem">
                    <div>
                        ${car.imageUrl
                            ? `<img src="${car.imageUrl}" alt="${car.make} ${car.model}"
                            style="width:100%;height:300px;object-fit:cover;border-radius:10px">`
                            : `<div style="width:100%;height:300px;background:linear-gradient(135deg,#1a1a2e,#0f3460);
                            border-radius:10px;display:flex;align-items:center;
                            justify-content:center;font-size:5rem">🚗</div>`
                        }
                    </div>
                    <div>
                        <h1 style="font-size:2rem;color:#1a1a2e;margin-bottom:0.5rem">
                            ${car.year} ${car.make} ${car.model}
                        </h1>
                        <div style="font-size:2rem;font-weight:700;color:#e94560;margin-bottom:1rem">
                            $${car.price.toLocaleString()}
                        </div>
                        <span class="status-badge status-${car.status.toLowerCase()}"
                            style="font-size:0.9rem;padding:4px 14px;margin-bottom:1rem;display:inline-block">
                            ${car.status}
                        </span>
                        <table style="width:100%;margin-top:1rem">
                            <tr><td style="color:#666;padding:6px 0">Colour</td>
                                <td style="font-weight:500">${car.colour}</td></tr>
                            <tr><td style="color:#666;padding:6px 0">Mileage</td>
                                <td style="font-weight:500">${car.mileage.toLocaleString()} km</td></tr>
                            <tr><td style="color:#666;padding:6px 0">Year</td>
                                <td style="font-weight:500">${car.year}</td></tr>
                            <tr><td style="color:#666;padding:6px 0">Dealer</td>
                                <td style="font-weight:500">${car.dealerName}</td></tr>
                        </table>
                        <div style="margin-top:1.5rem">
                            <div style="font-weight:600;margin-bottom:0.5rem">Description</div>
                            <p style="color:#555;line-height:1.7">${car.description}</p>
                        </div>
                        ${!isLoggedIn() ? `
                            <div style="margin-top:1.5rem">
                                <a href="login.html">
                                    <button class="btn btn-primary" style="width:100%;padding:0.8rem">
                                        Login to Book Test Drive
                                    </button>
                                </a>
                            </div>` : ''}
                    </div>
                </div>
            `;
        } catch (err) {
            container.innerHTML = '<div class="loading">Failed to load car details.</div>';
        }
    }

    async function submitBooking() {
        const dateInput = document.getElementById('booking-date').value;
        const notes = document.getElementById('booking-notes').value;
        const errorEl = document.getElementById('booking-error');
        const successEl = document.getElementById('booking-success');

        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        if (!dateInput) {
            errorEl.textContent = 'Please select a date and time.';
            errorEl.style.display = 'block';
            return;
        }

        // Convert to UTC ISO string
        const bookingDate = new Date(dateInput).toISOString();

        try {
            const response = await apiCreateBooking(
                parseInt(currentCarId), bookingDate, notes);
            const data = await response.json();

            if (!response.ok) {
                errorEl.textContent = data.message || 'Booking failed.';
                errorEl.style.display = 'block';
                return;
            }

            successEl.textContent = 'Test drive booked! The dealer will review your request.';
            successEl.style.display = 'block';
            document.getElementById('booking-date').value = '';
            document.getElementById('booking-notes').value = '';

        } catch (err) {
            errorEl.textContent = 'Could not connect to the API.';
            errorEl.style.display = 'block';
        }
    }
</script>
</body>
</html>
